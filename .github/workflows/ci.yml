name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guardian
          POSTGRES_PASSWORD: guardian_secret
          POSTGRES_DB: guardian_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://guardian:guardian_secret@localhost:5433/guardian_db?schema=public

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://guardian:guardian_secret@localhost:5433/guardian_db?schema=public
          JWT_ACCESS_SECRET: ci_secret_access_test
          JWT_REFRESH_SECRET: ci_secret_refresh_test
          JWT_ACCESS_TTL: 15m
          JWT_REFRESH_TTL: 7d
          NODE_ENV: test
          PORT: 3000

      - name: Build application
        run: npm run build
