services:
  - type: web
    name: guardian-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: develop
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: guardian-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: TWO_FACTOR_ENCRYPTION_KEY
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: HEARTBEAT_TIMEOUT_SECONDS
        value: 300
      - key: COMMAND_TTL_SECONDS
        value: 120
      - key: LOCK_COMMAND_TTL_SECONDS
        value: 60
      - key: WIPE_COMMAND_TTL_SECONDS
        value: 600
      - key: LOCATION_RETENTION_DAYS
        value: 30
      - key: ALLOW_REMOTE_WIPE
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "*"

databases:
  - name: guardian-db
    plan: free
    databaseName: guardian_db
    user: guardian
